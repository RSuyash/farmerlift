name: Deploy Frontend

on:
  workflow_dispatch:

concurrency:
  group: farmerlift-frontend-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Capture deploy ref
        run: |
          set -euo pipefail
          echo "DEPLOY_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "DEPLOY_SHORT_SHA=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Build frontend
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build

      - name: Package standalone release
        run: |
          set -euo pipefail
          release_root="$RUNNER_TEMP/farmerlift-release"
          release_dir="$release_root/release"
          rm -rf "$release_root"
          mkdir -p "$release_dir"

          test -f .next/standalone/server.js
          cp -a .next/standalone/. "$release_dir/"
          mkdir -p "$release_dir/.next"
          cp -a .next/static "$release_dir/.next/static"
          cp -a public "$release_dir/public"
          mkdir -p "$release_dir/.next/cache"

          node --input-type=module <<'NODE'
          import { mkdirSync, writeFileSync } from 'node:fs';
          const out = `${process.env.RUNNER_TEMP}/farmerlift-release/release/public/farmerlift-deploy.json`;
          mkdirSync(out.replace(/\/[^/]+$/, ''), { recursive: true });
          writeFileSync(out, `${JSON.stringify({
            source: 'github-actions',
            repository: process.env.GITHUB_REPOSITORY,
            sha: process.env.DEPLOY_SHA,
            runId: process.env.GITHUB_RUN_ID,
            runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            createdAt: new Date().toISOString(),
          })}\n`);
          NODE

          test -f "$release_dir/server.js"
          test -f "$release_dir/package.json"
          test -d "$release_dir/.next/static"
          test -d "$release_dir/public"
          test ! -e "$release_dir/.env"

          tar -czf "$RUNNER_TEMP/farmerlift-release.tar.gz" -C "$release_root" release
          bytes=$(stat -c '%s' "$RUNNER_TEMP/farmerlift-release.tar.gz")
          max=$((250 * 1024 * 1024))
          if [ "$bytes" -gt "$max" ]; then
            echo "::error::Release archive is too large: $bytes bytes"
            exit 1
          fi
          echo "Release archive bytes: $bytes"

      - name: Deploy over SSH stream
        env:
          WEBDEV_HOST: ${{ secrets.WEBDEV_HOST }}
          WEBDEV_USER: ${{ secrets.WEBDEV_USER }}
          WEBDEV_SSH_KEY: ${{ secrets.WEBDEV_SSH_KEY }}
          WEBDEV_SSH_PORT: ${{ secrets.WEBDEV_SSH_PORT || '22' }}
          WEBDEV_KNOWN_HOSTS: ${{ secrets.WEBDEV_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          remote="$WEBDEV_USER@$WEBDEV_HOST"
          key="$RUNNER_TEMP/farmerlift-actions-key"
          ssh_opts=(-i "$key" -p "$WEBDEV_SSH_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)

          install -m 700 -d ~/.ssh
          printf '%s\n' "$WEBDEV_SSH_KEY" | tr -d '\r' > "$key"
          chmod 600 "$key"
          if [ -n "${WEBDEV_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$WEBDEV_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          else
            for attempt in 1 2 3; do
              if ssh-keyscan -T 20 -p "$WEBDEV_SSH_PORT" -H "$WEBDEV_HOST" >> ~/.ssh/known_hosts; then
                break
              fi
              if [ "$attempt" = "3" ]; then
                echo "::error::Could not scan WEBDEV_HOST SSH key"
                exit 1
              fi
              sleep 5
            done
          fi

          for attempt in 1 2 3; do
            if cat "$RUNNER_TEMP/farmerlift-release.tar.gz" | ssh "${ssh_opts[@]}" "$remote" farmerlift; then
              exit 0
            fi
            if [ "$attempt" = "3" ]; then
              echo "::error::Could not deploy release over restricted webdev SSH"
              exit 1
            fi
            sleep $((attempt * 10))
          done

      - name: Verify public release
        run: |
          set -euo pipefail
          for url in \
            "https://farmerlift.in" \
            "https://www.farmerlift.in"
          do
            curl --fail --silent --show-error --location \
              --retry 8 --retry-delay 3 --retry-all-errors \
              -H 'Cache-Control: no-cache' \
              "$url/" >/dev/null
            curl --fail --silent --show-error --location \
              --retry 8 --retry-delay 3 --retry-all-errors \
              -H 'Cache-Control: no-cache' \
              "$url/products" >/dev/null
            marker="$(curl --fail --silent --show-error --location \
              --retry 8 --retry-delay 3 --retry-all-errors \
              -H 'Cache-Control: no-cache' \
              "$url/farmerlift-deploy.json")"
            echo "$marker" | grep -Fq "\"sha\":\"$DEPLOY_SHA\""
            echo "$url serves $DEPLOY_SHORT_SHA"
          done

          curl --fail --silent --show-error --head \
            --retry 5 --retry-delay 2 --retry-all-errors \
            https://admin.farmerlift.in/wp-json/ >/dev/null
