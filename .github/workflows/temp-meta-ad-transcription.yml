name: Temporary Whisper Model Artifact

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  package-model:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download multilingual Whisper model
        run: |
          mkdir -p model
          curl -L --fail --retry 5 --retry-delay 2 \
            -o model/ggml-small-q5_1.bin \
            https://github.com/Bagani/rec2text-models/releases/download/v1/ggml-small-q5_1.bin
          echo "ae85e4a935d7a567bd102fe55afc16bb595bdb618e11b2fc7591bc08120411bb  model/ggml-small-q5_1.bin" | sha256sum -c -
          ls -lh model/ggml-small-q5_1.bin

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisper-small-q5-model
          path: model/ggml-small-q5_1.bin
          compression-level: 0
          retention-days: 1
