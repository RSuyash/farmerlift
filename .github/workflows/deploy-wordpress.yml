name: Deploy WordPress Backend

on:
  push:
    branches: ["master"]
    paths:
      - "backend/wordpress/**"
  workflow_dispatch:

concurrency:
  group: farmerlift-wordpress-backend-production
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  php-checks:
    name: PHP Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Check PHP syntax
        run: |
          set -euo pipefail
          find backend/wordpress -name "*.php" -type f -print0 |
            xargs -0 -n1 php -l

  deploy:
    name: Deploy to Hostinger
    runs-on: ubuntu-latest
    needs: [php-checks]
    if: github.ref == 'refs/heads/master'
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Backup remote files
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
        run: |
          set -euo pipefail
          timestamp="$(date +%Y%m%d_%H%M%S)"
          remote_base="domains/admin.farmerlift.in/public_html/wp-content/themes/twentytwentyfive"
          backup_dir="domains/admin.farmerlift.in/backups/wordpress_${timestamp}"

          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USERNAME@$SSH_HOST" "
            set -e
            mkdir -p '$backup_dir'
            cp '$remote_base/functions.php' '$backup_dir/functions.php' 2>/dev/null || true
            cp -r '$remote_base/includes' '$backup_dir/includes' 2>/dev/null || true
            cd domains/admin.farmerlift.in/backups/ 2>/dev/null || exit 0
            ls -dt wordpress_* 2>/dev/null | tail -n +11 | xargs rm -rf 2>/dev/null || true
            echo '$backup_dir'
          "

      - name: Upload backend files
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
        run: |
          set -euo pipefail
          remote_base="domains/admin.farmerlift.in/public_html/wp-content/themes/twentytwentyfive"

          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USERNAME@$SSH_HOST" "
            set -e
            mkdir -p '$remote_base/includes/crm/ajax'
            mkdir -p '$remote_base/includes/crm/views'
            mkdir -p '$remote_base/includes/products/ajax'
            mkdir -p '$remote_base/includes/products/views'
          "

          scp -i ~/.ssh/deploy_key -P "$SSH_PORT" \
            backend/wordpress/functions.php \
            "$SSH_USERNAME@$SSH_HOST:$remote_base/functions.php"

          scp -i ~/.ssh/deploy_key -P "$SSH_PORT" -r \
            backend/wordpress/includes/. \
            "$SSH_USERNAME@$SSH_HOST:$remote_base/includes/"

      - name: Flush cache
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USERNAME@$SSH_HOST" \
            "cd domains/admin.farmerlift.in/public_html && php ~/wp-cli.phar cache flush || true"

      - name: Smoke test
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 5 --retry-delay 3 \
            https://admin.farmerlift.in/wp-json/ >/dev/null
          curl --fail --silent --show-error --location --retry 5 --retry-delay 3 \
            https://admin.farmerlift.in/wp-json/wp/v2/types >/dev/null
