name: Deploy WordPress Backend

on:
  push:
    branches: ["master"]
    paths:
      - "backend/wordpress/**"
  workflow_dispatch:

concurrency:
  group: farmerlift-wordpress-backend-production
  cancel-in-progress: true

jobs:
  php-checks:
    name: PHP Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Check PHP syntax
        run: |
          set -euo pipefail
          find backend/wordpress -name "*.php" -type f -print0 |
            xargs -0 -n1 php -l

  deploy:
    name: Deploy via Webdev Proxy
    runs-on: ubuntu-latest
    needs: [php-checks]
    if: github.ref == 'refs/heads/master'
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package backend files
        run: |
          set -euo pipefail
          package_root="$RUNNER_TEMP/farmerlift-wordpress"
          wordpress_dir="$package_root/wordpress"
          rm -rf "$package_root"
          mkdir -p "$wordpress_dir"

          cp backend/wordpress/functions.php "$wordpress_dir/functions.php"
          cp -a backend/wordpress/includes "$wordpress_dir/includes"

          test -f "$wordpress_dir/functions.php"
          test -d "$wordpress_dir/includes"
          tar -czf "$RUNNER_TEMP/farmerlift-wordpress.tar.gz" -C "$package_root" wordpress

          bytes=$(stat -c '%s' "$RUNNER_TEMP/farmerlift-wordpress.tar.gz")
          max=$((25 * 1024 * 1024))
          if [ "$bytes" -gt "$max" ]; then
            echo "::error::WordPress deploy archive is too large: $bytes bytes"
            exit 1
          fi
          echo "WordPress archive bytes: $bytes"

      - name: Deploy over restricted webdev SSH
        env:
          WEBDEV_HOST: ${{ secrets.WEBDEV_HOST }}
          WEBDEV_USER: ${{ secrets.WEBDEV_USER }}
          WEBDEV_SSH_KEY: ${{ secrets.WEBDEV_SSH_KEY }}
          WEBDEV_SSH_PORT: ${{ secrets.WEBDEV_SSH_PORT || '22' }}
          WEBDEV_KNOWN_HOSTS: ${{ secrets.WEBDEV_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          remote="$WEBDEV_USER@$WEBDEV_HOST"
          key="$RUNNER_TEMP/farmerlift-webdev-key"
          ssh_opts=(-i "$key" -p "$WEBDEV_SSH_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)

          install -m 700 -d ~/.ssh
          printf '%s\n' "$WEBDEV_SSH_KEY" | tr -d '\r' > "$key"
          chmod 600 "$key"
          if [ -n "${WEBDEV_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$WEBDEV_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          else
            for attempt in 1 2 3; do
              if ssh-keyscan -T 20 -p "$WEBDEV_SSH_PORT" -H "$WEBDEV_HOST" >> ~/.ssh/known_hosts; then
                break
              fi
              if [ "$attempt" = "3" ]; then
                echo "::error::Could not scan WEBDEV_HOST SSH key"
                exit 1
              fi
              sleep 5
            done
          fi

          for attempt in 1 2 3; do
            if cat "$RUNNER_TEMP/farmerlift-wordpress.tar.gz" | ssh "${ssh_opts[@]}" "$remote" farmerlift-wordpress; then
              exit 0
            fi
            if [ "$attempt" = "3" ]; then
              echo "::error::Could not deploy WordPress backend through restricted webdev SSH"
              exit 1
            fi
            sleep $((attempt * 10))
          done

      - name: Smoke test
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 5 --retry-delay 3 \
            https://admin.farmerlift.in/wp-json/ >/dev/null
          curl --fail --silent --show-error --location --retry 5 --retry-delay 3 \
            https://admin.farmerlift.in/wp-json/wp/v2/types >/dev/null
